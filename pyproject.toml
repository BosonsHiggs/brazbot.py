[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brazbot"
version = "2.0.0"
description = "Biblioteca brasileira nativa e assíncrona para criação de bots na API v10 e Voice Gateway v8 do Discord"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aril Ogai", email = "iagolirapassos@gmail.com" }
]
keywords = ["discord", "bot", "api-v10", "voice-v8", "music", "async", "brazbot", "brazil"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.9.0",
    "PyNaCl>=1.5.0",
    "cryptography>=38.0.0",
    "yt-dlp>=2024.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
latest = [
    "aiohttp>=3.14.5",
    "PyNaCl>=1.6.2",
    "cryptography>=44.0.0",
    "yt-dlp>=2026.10.26",
    "python-dotenv>=1.2.4",
]

[project.urls]
Homepage = "https://github.com/BosonsHiggs/brazbot.py"
Repository = "https://github.com/BosonsHiggs/brazbot.py"
Issues = "https://github.com/BosonsHiggs/brazbot.py/issues"

[project.scripts]
brazbot = "brazbot.bot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brazbot*"]
exclude = ["tests*", "examples*"]
