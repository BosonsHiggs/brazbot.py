[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brazbot"
version = "2.0.0"
description = "Production-ready native Python library for Discord API v10 and Voice Gateway v8 with zero third-party Discord dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BosonsHiggs"}
]
keywords = ["discord", "api-v10", "voice-v8", "bot", "slash-commands", "moderation", "music", "components-v2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14.5",
    "cryptography>=44.0.0",
    "yt-dlp>=2026.03.17",
]

[project.optional-dependencies]
speed = [
    "aiodns>=3.2.0",
    "Brotli>=1.1.0",
    "PyNaCl>=1.5.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/BosonsHiggs/brazbot.py"
Repository = "https://github.com/BosonsHiggs/brazbot.py"
Issues = "https://github.com/BosonsHiggs/brazbot.py/issues"
